spring:
  application:
    name: storemanager
  datasource:
    url: jdbc:h2:file:${app.data-dir}/storemanager
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      # La SPA la sirve WebConfig, con fallback a index.html
      add-mappings: false

server:
  port: 8080
  # Detrás de Caddy o Tailscale Funnel. Tomcat (RemoteIpValve) solo cree en X-Forwarded-For/-Proto
  # cuando el pedido llega desde un proxy de confianza: loopback (Funnel) o una red de Docker (Caddy).
  # Un cliente que habla directo al puerto no puede hacerse pasar por otra IP.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}'

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api/openapi.json

app:
  data-dir: ./data
  # Base de los links de los QR. En THREE: la URL de Caddy (LAN) o la pública de Funnel.
  public-base-url: http://localhost:5173
  cookie-secure: false
  gm-session-ttl: 30d
  player-session-ttl: 180d
  # Si no está vacía, crear campañas exige esta clave.
  campaign-creation-key: ""
  # Clave del portal /admin (todas las campañas). Vacía o de menos de 16 caracteres: el portal no existe.
  admin-key: ""
  admin-session-ttl: 12h
  # Tope del cuerpo de cualquier pedido (256 KB): un item con descripción larga entra holgado.
  max-request-bytes: 262144
